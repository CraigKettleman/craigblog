# hhy.homes — nginx reverse proxy for the SvelteKit node server on :3000
# HTTPS via Let's Encrypt (certbot). 全站已跳 https（443 已在安全组放行）。
# www 的 CAA/DNS 有问题，无法单独签证书，www 统一 301 到 https://hhy.homes。

# ---- HTTPS (443) ----
server {
    server_name hhy.homes www.hhy.homes;

    # Old URLs from the original site's _redirects
    location = /works { return 301 /work; }
    location = /en/works { return 301 /en/work; }
    location = /zh/works { return 301 /zh/work; }
    location = /en/posts { return 301 /en/work; }
    location = /zh/posts { return 301 /zh/work; }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml image/x-icon;

    # 未哈希的 /static/ 资源
    location /static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
    }

    # 带哈希的构建产物，可永久缓存
    location /_app/immutable/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 其余全部交给 node（含 API、feed、sitemap、SSR）
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/hhy.homes/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/hhy.homes/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ---- HTTP (80) — 443 已放行，全站跳 https ----
server {
    listen 80;
    listen [::]:80;
    server_name hhy.homes www.hhy.homes;
    return 301 https://hhy.homes$request_uri;
}
